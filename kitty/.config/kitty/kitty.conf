# ==============================================================================
# Fonts: Family, Size & Rendering
# Use MesloLGS NF at 13pt across macOS and CachyOS.
# ==============================================================================

font_family              MesloLGS NF
bold_font                auto
italic_font              auto
bold_italic_font         auto
font_size                13.0

# ==============================================================================
# Cursor & Trail Effects: Shape, Blinking & Motion Trail
# Keep a crisp block cursor with a subtle, fast-fading cursor trail.
# ==============================================================================

cursor_shape             block
cursor_shape_unfocused   hollow
cursor_blink_interval    -1
cursor_trail             3
cursor_trail_decay       0.1 0.35
cursor_trail_start_threshold 2
cursor_trail_color       none

# ==============================================================================
# Shell & Zsh Integration: Prompt Marks, Scrolling & Ergonomics
# Enable Kitty shell integration for Zsh and keep generous scrollback.
# ==============================================================================

shell_integration        enabled
scrollback_lines         5000
wheel_scroll_multiplier  5.0
pixel_scroll             yes
detect_urls              yes
url_style                curly
underline_hyperlinks     hover
copy_on_select           no

# ==============================================================================
# Window & Platform: Padding, Sizing & macOS Tweaks
# Match Gruvbox background on macOS titlebars; ignored on Linux/Hyprland.
# ==============================================================================

window_padding_width     12
remember_window_size     yes
initial_window_width     820
initial_window_height    500
macos_titlebar_color     background
hide_window_decorations  no
macos_option_as_alt      yes

# ==============================================================================
# Theme: Gruvbox Dark Palette
# Preserve Gruvbox Dark (#282828 / #ebdbb2) and 16-color ANSI table.
# ==============================================================================

background #282828
foreground #ebdbb2

# Normal colors (0-7)
color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984

# Bright colors (8-15)
color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
color12 #83a598
color13 #d3869b
color14 #8ec07c
color15 #ebdbb2
